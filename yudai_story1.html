<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MoshiMo | yudai story 1</title>
  <link rel="stylesheet" href="yudai_story.css">
</head>
<body>
  <div class="phone">
    <main class="story" aria-label="雄大のストーリー1">
      <div class="bg">
        <img src="yudai_1.png" alt="朝焼けのトラック運転席と、妻ありさから届いたLINE通知">
      </div>

      <section class="top">
        <div class="bars" aria-label="ストーリー進行状況">
          <div class="bar active"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>

        <div class="profile">
          <button class="back" type="button" onclick="location.href='index.html'" aria-label="戻る">‹</button>
          <img class="icon" src="yudai.png" alt="雄大のアイコン">
          <div class="profile-text">
            <div class="who">yudai_truck 🚚</div>
            <div class="time">たった今 ・ 配達中</div>
          </div>
          <div class="dots">…</div>
          <button class="close" type="button" onclick="location.href='index.html'" aria-label="閉じる">×</button>
        </div>
      </section>

      <section class="content">
        <div class="caption">あと1件ガンバろ🔥</div>

        <div class="navrow">
          <button class="next" type="button" onclick="location.href='yudai_story2.html'">
            次のストーリーへ ▶
          </button>
        </div>
      </section>
    </main>

    <div class="bottom">
      <div class="reply">メッセージを送信…</div>
      <button class="send" type="button">送信</button>
    </div>
  </div>
</body>
</html>

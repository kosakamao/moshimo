<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MoshiMo | 雄大 Story2</title>

  <link rel="stylesheet" href="yudai_story.css">
</head>

<body>

<div class="phone">

  <main class="story">

    <!-- 背景画像 -->
    <div class="bg">
      <img src="yudai_2.png" alt="レースゲームで遊ぶジュキヤ兄弟">
    </div>

    <!-- 上部UI -->
    <section class="top">

      <div class="bars">
        <div class="bar done"></div>
        <div class="bar active"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>

      <div class="profile">

        <button
          class="back"
          onclick="location.href='yudai_story1.html'">
          ‹
        </button>

        <img
          class="icon"
          src="yudai.png"
          alt="雄大">

        <div class="profile-text">
          <div class="who">yudai_truck 🚚</div>
          <div class="time">2時間前</div>
        </div>

        <div class="dots">…</div>

        <button
          class="close"
          onclick="location.href='index.html'">
          ×
        </button>

      </div>

    </section>

    <!-- 下部 -->
    <section class="content">

      <div class="caption">

昼前帰宅！<br>
今日もありさ飯ありがとう🍞<br><br>

ジュキヤ、今日もレースゲーム勝負な🚗💨<br>
最近めっちゃ速くなってきた😂<br>
将来はドライバーかな✌️

      </div>

      <div class="navrow">

        <button
          class="next"
          onclick="location.href='yudai_story3.html'">

          次のストーリーへ ▶

        </button>

      </div>

    </section>

  </main>

  <div class="bottom">

    <div class="reply">
      メッセージを送信…
    </div>

    <button class="send">
      送信
    </button>

  </div>

</div>

</body>
</html>
